name: Update LibreTV sources

on:
  schedule:
    - cron: '0 19 * * *' # 每天 UTC 19:00（北京时间 03:00）
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: update-sources
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Build sources
        run: node scripts/build.mjs

      - name: Commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add libretv-sources.json live/merged.m3u
          if git diff --cached --quiet; then
            echo "无变化，跳过提交"
          else
            git commit -m "chore: 更新源清单 $(date -u +%Y-%m-%d)"
            git push
          fi
